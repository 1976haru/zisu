name: Windows build and tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run isolated stress gate
        run: python tests/stress_v43.py
      - name: Compile Python sources
        run: python -m compileall -q mcrs tests main.py
      - name: Install packager
        run: python -m pip install -r requirements-oauth.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all google_auth_oauthlib --name ZisuResearchStudio main.py
      - name: Verify packaged OAuth modules
        shell: pwsh
        run: |
          pyi-archive_viewer -l -r dist\ZisuResearchStudio.exe | Out-File -Encoding utf8 archive_listing.txt
          foreach ($module in @('google_auth_oauthlib', 'google.oauth2.credentials', 'requests')) {
            if (-not (Select-String -LiteralPath archive_listing.txt -Pattern $module -Quiet)) {
              throw "Required packaged module missing: $module"
            }
          }
      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist\ZisuResearchStudio.exe).Hash.ToLowerInvariant()
          "$hash  ZisuResearchStudio.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - name: Create minimal release ZIP
        shell: pwsh
        run: ./scripts/package_windows.ps1 -ExePath dist/ZisuResearchStudio.exe -OutputDirectory dist/release -ManualPath 사용설명서_초보자.html -QuickStartPath 빠른시작_먼저읽기.txt
      - name: Run copied EXE offline smoke without Python on PATH
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ZISU 배포 日本語 path'
          Expand-Archive -LiteralPath dist/release/ZISU-Research-Studio-V4.4-Windows.zip -DestinationPath $target
          $expected = (Get-Content -LiteralPath (Join-Path $target 'SHA256SUMS.txt') -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $target 'ZisuResearchStudio.exe')).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Packaged EXE hash mismatch.' }
          ./scripts/windows_exe_smoke.ps1 -ExePath (Join-Path $target 'ZisuResearchStudio.exe') -WorkRoot (Join-Path $env:RUNNER_TEMP 'zisu-exe-smoke')
      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: ZisuResearchStudio-Windows
          path: |
            dist/ZisuResearchStudio.exe
            dist/SHA256SUMS.txt
            dist/release/ZISU-Research-Studio-V4.4-Windows.zip
            dist/release/RELEASE_SHA256SUMS.txt
          if-no-files-found: error
