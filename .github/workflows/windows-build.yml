name: Windows build and tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install packager
        run: python -m pip install -r requirements-oauth.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all google_auth_oauthlib --name ZisuResearchStudio main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZisuResearchStudio-Windows
          path: dist/ZisuResearchStudio.exe
          if-no-files-found: error
